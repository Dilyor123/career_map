<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Career Map - OTMlar va Navigator</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --hint: #94a3b8;
      --accent: #38bdf8;
      --accent-text: #0f172a;
      --border: #334155;
      --grant-color: #22c55e;
      --kont-color: #f59e0b;
      --nav-color: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 14px;
      padding-bottom: 30px;
    }

    header {
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-box h1 {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title-box p {
      font-size: 12px;
      color: var(--hint);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .lang-btn, .refresh-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .search-box {
      margin-bottom: 12px;
    }
    .search-box input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
    }

    .tabs-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }

    .tab-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--hint);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-pill.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    select {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      outline: none;
      width: 100%;
    }

    .score-slider-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .score-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .score-val {
      color: var(--accent);
      font-weight: 700;
    }
    .score-slider-box input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .stats-info {
      font-size: 12px;
      color: var(--hint);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .otm-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }
    .otm-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      color: #fff;
    }
    .badge-viloyat {
      background: #334155;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .otm-field {
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .scores-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .score-pill {
      flex: 1;
      padding: 7px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
    .pill-grant {
      background: rgba(34, 197, 94, 0.15);
      color: var(--grant-color);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .pill-kont {
      background: rgba(245, 158, 11, 0.15);
      color: var(--kont-color);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .card-meta {
      font-size: 12px;
      color: var(--hint);
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-top: 1px solid #2d3748;
      padding-top: 8px;
      margin-bottom: 10px;
    }
    .card-meta div {
      display: flex;
      justify-content: space-between;
    }

    /* Navigator Tugmasi */
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      background: rgba(6, 182, 212, 0.15);
      color: var(--nav-color);
      border: 1px solid rgba(6, 182, 212, 0.4);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .nav-btn:active {
      background: rgba(6, 182, 212, 0.3);
    }
  </style>
</head>
<body>

  <header>
    <div class="title-box">
      <h1>🎓 Career Map</h1>
      <p id="sub_title">OTMlar va Navigator</p>
    </div>
    <div class="header-actions">
      <button class="refresh-btn" onclick="fetchData()" title="Yangilash">🔄</button>
      <button class="lang-btn" onclick="toggleLang()" id="lang_btn">RU</button>
    </div>
  </header>

  <div class="search-box">
    <input type="text" id="search_input" placeholder="🔍 Qidiruv (TATU, Dasturchi, Shifokor...)" oninput="applyFilters()">
  </div>

  <div class="tabs-scroll" id="tabs_container"></div>

  <div class="filter-grid">
    <select id="viloyat_select" onchange="applyFilters()">
      <option value="">Barcha hududlar</option>
    </select>
    <select id="sort_select" onchange="applyFilters()">
      <option value="default">Tartiblash (Standart)</option>
      <option value="grant_desc">Grant ball: Yuqoridan</option>
      <option value="grant_asc">Grant ball: Pastdan</option>
    </select>
  </div>

  <div class="score-slider-box">
    <div class="score-header">
      <span id="score_label">🎯 Ball bo'yicha filtrlash:</span>
      <span class="score-val" id="score_display">Barchasi</span>
    </div>
    <input type="range" id="score_slider" min="50" max="189" value="0" step="0.5" oninput="onScoreChange(this.value)">
  </div>

  <div class="stats-info">
    <span id="stats_info">Yuklanmoqda...</span>
    <span id="sync_status" style="font-size: 11px; color: var(--grant-color);"></span>
  </div>

  <div class="cards-container" id="cards_list"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTIkHNkexCIoeeV-Alx7LD5r5ZzM5S_xQH4NZOjH4HstjoRl0Q8U4K57quOK6vHnLJG-n9MEUhYa0QB/pub?gid=0&single=true&output=csv";

    let DATA = [];
    let currentLang = 'uz';
    let selectedSoha = 'ALL';
    let userScore = 0;

    // 🧭 NAVIGATOR: Yandex Maps & Google Maps orqali OTM lokatsiyasini ochish
    function openNavigator(otmName, city) {
      const query = encodeURIComponent(`${otmName} ${city} Uzbekistan`);
      const navUrl = `https://yandex.com/maps/?text=${query}`;
      if (tg && tg.openLink) {
        tg.openLink(navUrl);
      } else {
        window.open(navUrl, '_blank');
      }
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const parseRow = (line) => {
        const res = []; let cur = ''; let inQ = false;
        for (let i = 0; i < line.length; i++) {
          if (line[i] === '"') inQ = !inQ;
          else if (line[i] === ',' && !inQ) { res.push(cur.trim()); cur = ''; }
          else cur += line[i];
        }
        res.push(cur.trim());
        return res;
      };
      const headers = parseRow(lines[0]);
      return lines.slice(1).filter(l => l.trim()).map(l => {
        const vals = parseRow(l);
        const obj = {};
        headers.forEach((h, i) => obj[h] = (vals[i] || '').replace(/^"|"$/g, ''));
        return obj;
      });
    }

    async function fetchData() {
      const syncStatus = document.getElementById('sync_status');
      syncStatus.innerText = "⏳ Yuklanmoqda...";
      try {
        if (!GOOGLE_SHEET_CSV_URL.includes("PLACEHOLDER")) {
          const res = await fetch(`${GOOGLE_SHEET_CSV_URL}&t=${Date.now()}`);
          DATA = parseCSV(await res.text());
          syncStatus.innerText = "✅ Jonli ulandi";
        } else { throw new Error(); }
      } catch {
        syncStatus.innerText = "⚡ Lokal baza";
        DATA = [
          { soha: "IT", kasb: "Dasturchi", viloyat: "Toshkent", otm: "Toshkent axborot texnologiyalari universiteti (TATU)", yonalish: "Dasturiy injiniring", grant_bal: "165.5", kontrakt_bal: "132.4", fanlar: "Matematika, Fizika", sertifikat: "Ingliz tili B2", kontrakt_narx: "17.2 mln so'm" },
          { soha: "Tibbiyot", kasb: "Shifokor", viloyat: "Toshkent", otm: "Toshkent tibbiyot akademiyasi (TTA)", yonalish: "Davolash ishi", grant_bal: "178.5", kontrakt_bal: "145.2", fanlar: "Biologiya, Kimyo", sertifikat: "Biologiya / Kimyo (A/A+)", kontrakt_narx: "19.8 mln so'm" },
          { soha: "Huquq", kasb: "Huquqshunos", viloyat: "Toshkent", otm: "Toshkent davlat yuridik universiteti (TDYU)", yonalish: "Yurisprudensiya", grant_bal: "181.2", kontrakt_bal: "149.6", fanlar: "Tarix, Chet tili", sertifikat: "Chet tili B2", kontrakt_narx: "22.5 mln so'm" },
          { soha: "San'at", kasb: "Aktyor", viloyat: "Farg'ona", otm: "O'zDSMI Farg'ona mintaqaviy filiali", yonalish: "Aktyorlik san'ati", grant_bal: "136.0", kontrakt_bal: "102.0", fanlar: "Ijodiy sinovlar", sertifikat: "Talab qilinmaydi", kontrakt_narx: "13.5 mln so'm" },
          { soha: "Aniq fanlar", kasb: "Matematik", viloyat: "Samarqand", otm: "Samarqand davlat universiteti (SamDU)", yonalish: "Amaliy matematika", grant_bal: "158.4", kontrakt_bal: "124.2", fanlar: "Matematika, Fizika", sertifikat: "Matematika sertifikat", kontrakt_narx: "15.0 mln so'm" }
        ];
      }
      initTabs();
      applyFilters();
    }

    function initTabs() {
      const box = document.getElementById('tabs_container');
      const sohalar = [...new Set(DATA.map(d => d.soha))].filter(Boolean);
      box.innerHTML = `<button class="tab-pill ${selectedSoha==='ALL'?'active':''}" onclick="selectTab('ALL')">⭐ Barchasi</button>` +
        sohalar.map(s => `<button class="tab-pill ${selectedSoha===s?'active':''}" onclick="selectTab('${s}')">${s}</button>`).join('');

      const viloyatlar = [...new Set(DATA.map(d => d.viloyat))].filter(Boolean).sort();
      document.getElementById('viloyat_select').innerHTML = '<option value="">📍 Barcha hududlar</option>' +
        viloyatlar.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function selectTab(s) { selectedSoha = s; initTabs(); applyFilters(); }

    function onScoreChange(val) {
      userScore = parseFloat(val);
      document.getElementById('score_display').innerText = userScore > 50 ? `${userScore} ball` : 'Barchasi';
      applyFilters();
    }

    function toggleLang() {
      currentLang = currentLang === 'uz' ? 'ru' : 'uz';
      document.getElementById('lang_btn').innerText = currentLang === 'uz' ? 'RU' : 'UZ';
      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById('search_input').value.trim().toLowerCase();
      const v = document.getElementById('viloyat_select').value;
      const sort = document.getElementById('sort_select').value;

      let list = DATA.filter(item => {
        if (selectedSoha !== 'ALL' && item.soha !== selectedSoha) return false;
        if (v && item.viloyat !== v) return false;
        if (q) {
          const match = (item.otm||'').toLowerCase().includes(q) ||
                        (item.yonalish||'').toLowerCase().includes(q) ||
                        (item.kasb||'').toLowerCase().includes(q);
          if (!match) return false;
        }
        if (userScore > 50) {
          const kBal = parseFloat(item.kontrakt_bal);
          if (!isNaN(kBal) && userScore < kBal) return false;
        }
        return true;
      });

      if (sort === 'grant_desc') list.sort((a,b) => (parseFloat(b.grant_bal)||0) - (parseFloat(a.grant_bal)||0));
      if (sort === 'grant_asc') list.sort((a,b) => (parseFloat(a.grant_bal)||0) - (parseFloat(b.grant_bal)||0));

      renderCards(list);
    }

    function renderCards(list) {
      const cont = document.getElementById('cards_list');
      const stats = document.getElementById('stats_info');
      stats.innerText = `Topildi: ${list.length} ta OTM`;

      if (!list.length) { cont.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8;">Hech narsa topilmadi 😔</div>'; return; }

      cont.innerHTML = list.map(item => `
        <div class="otm-card">
          <div class="card-top">
            <div class="otm-name">🏛 ${item.otm}</div>
            <span class="badge-viloyat">${item.viloyat}</span>
          </div>
          <div class="otm-field">📚 ${item.yonalish}</div>
          <div class="scores-row">
            <div class="score-pill pill-grant">🎯 Grant: ${item.grant_bal}</div>
            <div class="score-pill pill-kont">💳 Kontrakt: ${item.kontrakt_bal}</div>
          </div>
          <div class="card-meta">
            <div><span>📝 Fanlar:</span> <span>${item.fanlar}</span></div>
            <div><span>📜 Sertifikat:</span> <span>${item.sertifikat}</span></div>
            <div><span>💰 Kontrakt narxi:</span> <span>${item.kontrakt_narx}</span></div>
          </div>
          <button class="nav-btn" onclick="openNavigator('${item.otm.replace(/'/g, "\\'")}', '${item.viloyat}')">
            🧭 Navigator orqali xaritada ko'rish
          </button>
        </div>
      `).join('');
    }

    fetchData();
  </script>
</body>
</html>
