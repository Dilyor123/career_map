<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Career Map</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ---------- Ranglar: Telegram mavzusidan olinadi, bo'lmasa zaxira ---------- */
  :root {
    --fb-bg: #0b1220; --fb-card: #151f32; --fb-text: #eef2f7; --fb-hint: #8b98ab;
    --fb-accent: #3aa0ff; --fb-on-accent: #ffffff;
    --bg: var(--tg-theme-secondary-bg-color, var(--fb-bg));
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--fb-card)));
    --text: var(--tg-theme-text-color, var(--fb-text));
    --hint: var(--tg-theme-hint-color, var(--fb-hint));
    --accent: var(--tg-theme-button-color, var(--fb-accent));
    --on-accent: var(--tg-theme-button-text-color, var(--fb-on-accent));
    --link: var(--tg-theme-link-color, var(--accent));
    --sep: rgba(127,127,127,.18);
    --chip: rgba(127,127,127,.13);
    --ok: #22c55e; --mid: #f59e0b; --no: #ef4444; --info: #3aa0ff;
    --r: 14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root { --fb-bg: #f1f3f7; --fb-card: #ffffff; --fb-text: #0f172a; --fb-hint: #6b7280; --fb-accent: #2481cc; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + var(--safe-b));
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select { font: inherit; color: var(--text); }
  .hidden { display: none !important; }

  /* ---------- Sarlavha ---------- */
  .appbar { display: flex; align-items: center; gap: 10px; padding: 12px 14px 6px; }
  .appbar .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--on-accent);
    display: grid; place-items: center; font-size: 18px; flex: none; }
  .appbar .ttl { flex: 1; min-width: 0; }
  .appbar h1 { font-size: 17px; font-weight: 750; letter-spacing: -.2px; }
  .appbar p { font-size: 12px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { height: 32px; min-width: 32px; padding: 0 10px; border-radius: 16px; background: var(--card);
    font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .icon-btn:active { opacity: .6; }

  /* ---------- Katalog: yopishqoq yuqori qism ---------- */
  .sticky { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 6px 14px 8px; }
  .search { position: relative; }
  .search input { width: 100%; height: 42px; border-radius: 12px; border: 1px solid transparent; background: var(--card);
    padding: 0 38px 0 38px; outline: none; font-size: 15px; }
  .search input:focus { border-color: var(--accent); }
  .search .ico { position: absolute; left: 12px; top: 11px; font-size: 15px; opacity: .55; pointer-events: none; }
  .search .clr { position: absolute; right: 6px; top: 6px; width: 30px; height: 30px; border-radius: 15px; color: var(--hint); font-size: 16px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-top: 8px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 32px; padding: 0 12px; border-radius: 16px; background: var(--card); color: var(--text);
    font-size: 13px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .chip small { color: var(--hint); font-weight: 600; font-size: 11px; }
  .chip.on { background: var(--accent); color: var(--on-accent); }
  .chip.on small { color: inherit; opacity: .75; }
  .chip.sm { height: 28px; font-size: 12px; padding: 0 10px; background: var(--chip); }
  .chip.sm.on { background: var(--accent); }

  .wrap { padding: 0 14px; }
  .note { font-size: 12.5px; color: var(--hint); background: var(--card); border-radius: 12px; padding: 10px 12px; margin: 4px 0 8px; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 8px; }
  select { height: 38px; border-radius: 10px; border: 0; background: var(--card); padding: 0 10px; width: 100%; outline: none; font-size: 13px;
    appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--hint) 50%), linear-gradient(135deg, var(--hint) 50%, transparent 50%);
    background-position: calc(100% - 15px) 17px, calc(100% - 10px) 17px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 26px; }

  .scorebox { background: var(--card); border-radius: var(--r); padding: 10px 12px; margin-bottom: 8px; }
  .scorebox .row1 { display: flex; align-items: center; gap: 8px; }
  .scorebox label { font-size: 13px; font-weight: 650; flex: 1; }
  .scorebox input[type=number] { width: 76px; height: 32px; border-radius: 8px; border: 1px solid var(--sep); background: transparent;
    text-align: center; font-weight: 700; outline: none; }
  .scorebox input[type=range] { width: 100%; margin-top: 8px; accent-color: var(--accent); }
  .scorebox .row2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; font-size: 12px; color: var(--hint); }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text); font-weight: 600; }
  .switch i { width: 34px; height: 20px; border-radius: 10px; background: var(--chip); position: relative; transition: .2s; }
  .switch i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 8px; background: #fff; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch.on i { background: var(--ok); }
  .switch.on i::after { left: 16px; }

  .stats { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--hint); margin: 2px 2px 8px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 4px; margin-right: 5px; vertical-align: 1px; background: var(--hint); }
  .dot.live { background: var(--ok); } .dot.cache, .dot.local { background: var(--mid); } .dot.offline { background: var(--no); }
  .link-btn { color: var(--link); font-weight: 650; font-size: 12px; }

  /* ---------- Kartalar ---------- */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--card); border-radius: var(--r); padding: 12px 12px 11px; position: relative; cursor: pointer; transition: transform .08s; }
  .card:active { transform: scale(.985); }
  .c-head { display: flex; gap: 8px; align-items: flex-start; }
  .c-title { flex: 1; font-size: 15px; font-weight: 680; line-height: 1.3; letter-spacing: -.1px; }
  .c-line { color: var(--link); font-size: 13px; font-weight: 600; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag { font-size: 11.5px; font-weight: 600; color: var(--hint); background: var(--chip); padding: 3px 8px; border-radius: 7px; }
  .tag.priv { color: #a78bfa; background: rgba(167,139,250,.14); }
  .tag.path { color: var(--info); background: rgba(58,160,255,.13); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .pill { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 8px; }
  .pill.g { color: var(--ok); background: rgba(34,197,94,.13); }
  .pill.k { color: var(--mid); background: rgba(245,158,11,.13); }
  .pill.n { color: var(--info); background: rgba(58,160,255,.12); }
  .ch { font-size: 12px; font-weight: 750; padding: 4px 9px; border-radius: 8px; margin-left: auto; }
  .ch.ok { background: var(--ok); color: #fff; } .ch.mid { background: var(--mid); color: #1f1300; } .ch.no { background: rgba(239,68,68,.14); color: var(--no); }
  .c-foot { font-size: 12.5px; color: var(--hint); margin-top: 8px; }
  .fav { width: 32px; height: 32px; margin: -6px -6px 0 0; border-radius: 16px; font-size: 19px; line-height: 32px; color: var(--hint); flex: none; }
  .fav.on { color: #fbbf24; }
  .fav:active { transform: scale(.85); }
  .cmpbox { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--hint); flex: none; margin-top: 1px; display: grid; place-items: center; font-size: 13px; color: #fff; }
  .cmpbox.on { background: var(--accent); border-color: var(--accent); }

  .empty { text-align: center; padding: 34px 16px; color: var(--hint); }
  .empty b { display: block; font-size: 34px; margin-bottom: 6px; }
  .empty .btn { margin-top: 12px; }
  .skel { height: 104px; border-radius: var(--r); background: linear-gradient(90deg, var(--card) 0%, var(--chip) 50%, var(--card) 100%);
    background-size: 200% 100%; animation: sh 1.2s infinite linear; }
  @keyframes sh { to { background-position: -200% 0; } }
  .more { text-align: center; padding: 14px; color: var(--hint); font-size: 12px; }

  /* ---------- Tugmalar ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 12px;
    background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 14.5px; }
  .btn.sec { background: var(--chip); color: var(--text); }
  .btn.block { width: 100%; }
  .btn:active { opacity: .75; }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .actions .btn { height: 42px; font-size: 13.5px; }

  /* ---------- Pastki menyu ---------- */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--card); border-top: 1px solid var(--sep); padding: 6px 6px calc(6px + var(--safe-b)); }
  .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: var(--hint); font-size: 10.5px; font-weight: 650; position: relative; }
  .tabbar button .i { font-size: 20px; line-height: 24px; filter: grayscale(1); opacity: .75; }
  .tabbar button.on { color: var(--accent); }
  .tabbar button.on .i { filter: none; opacity: 1; }
  .badge { position: absolute; top: 0; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--no); color: #fff; font-size: 10px; font-weight: 800; line-height: 17px; }

  /* ---------- Pastdan chiquvchi oyna ---------- */
  .sheet { position: fixed; inset: 0; z-index: 40; visibility: hidden; }
  .sheet .bd { position: absolute; inset: 0; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .2s; }
  .sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 90vh; overflow-y: auto; background: var(--bg);
    border-radius: 18px 18px 0 0; padding: 8px 14px calc(18px + var(--safe-b)); transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); overscroll-behavior: contain; }
  .sheet.open { visibility: visible; }
  .sheet.open .bd { opacity: 1; }
  .sheet.open .panel { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--sep); margin: 0 auto 10px; }
  .sh-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .sh-head h2 { flex: 1; font-size: 18px; font-weight: 750; line-height: 1.25; letter-spacing: -.2px; }
  .sh-head .x { width: 30px; height: 30px; border-radius: 15px; background: var(--chip); color: var(--hint); font-size: 15px; flex: none; }
  .sec { background: var(--card); border-radius: var(--r); padding: 12px; margin-top: 10px; }
  .sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--hint); font-weight: 700; margin-bottom: 8px; }
  .kv { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--sep); font-size: 13.5px; }
  .kv:first-of-type { border-top: 0; padding-top: 0; }
  .kv span:first-child { color: var(--hint); flex: 0 0 38%; }
  .kv span:last-child { flex: 1; word-break: break-word; }
  .ul { list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
  .ul li { padding-left: 14px; position: relative; }
  .ul li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 5px; height: 5px; border-radius: 3px; background: var(--accent); }
  .big-scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bs { border-radius: 12px; padding: 10px; text-align: center; }
  .bs b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
  .bs span { font-size: 12px; font-weight: 650; }
  .bs.g { background: rgba(34,197,94,.13); color: var(--ok); } .bs.k { background: rgba(245,158,11,.13); color: var(--mid); }
  .verdict { margin-top: 8px; padding: 9px 11px; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .verdict.ok { background: rgba(34,197,94,.13); color: var(--ok); } .verdict.mid { background: rgba(245,158,11,.13); color: var(--mid); } .verdict.no { background: rgba(239,68,68,.12); color: var(--no); }

  /* Taqqoslash jadvali */
  .cmp { overflow-x: auto; margin-top: 6px; }
  .cmp table { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 13px; }
  .cmp th, .cmp td { padding: 9px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--sep); min-width: 140px; background: var(--card); }
  .cmp th { font-weight: 750; font-size: 13px; }
  .cmp td:first-child, .cmp th:first-child { position: sticky; left: 0; min-width: 96px; max-width: 110px; color: var(--hint); font-weight: 600; z-index: 1; }
  .cmp .best { color: var(--ok); font-weight: 750; }

  /* ---------- Kalkulyator ---------- */
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--chip); border-radius: 11px; padding: 3px; margin: 6px 0 10px; }
  .seg button { height: 34px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--hint); }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .total { background: var(--card); border-radius: var(--r); padding: 16px; text-align: center; }
  .total b { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; }
  .total small { font-size: 16px; color: var(--hint); font-weight: 700; }
  .bar { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .2s; }
  .reach { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .reach div { border-radius: 10px; padding: 8px; font-size: 12px; font-weight: 650; }
  .reach div b { display: block; font-size: 20px; }
  .reach .g { background: rgba(34,197,94,.13); color: var(--ok); } .reach .k { background: rgba(245,158,11,.13); color: var(--mid); }
  .field { background: var(--card); border-radius: var(--r); padding: 4px 12px; margin-top: 8px; }
  .frow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--sep); }
  .frow:first-child { border-top: 0; }
  .frow .lb { flex: 1; min-width: 0; }
  .frow .lb div { font-size: 14px; font-weight: 600; }
  .frow .lb small { font-size: 11.5px; color: var(--hint); }
  .step { display: flex; align-items: center; gap: 4px; }
  .step button { width: 32px; height: 32px; border-radius: 10px; background: var(--chip); font-size: 18px; font-weight: 700; }
  .step input { width: 44px; height: 32px; border: 0; background: transparent; text-align: center; font-weight: 750; font-size: 16px; outline: none; }
  .frow .pts { width: 48px; text-align: right; font-weight: 750; color: var(--link); font-size: 13px; }

  /* ---------- Muddatlar ---------- */
  .hero { background: var(--accent); color: var(--on-accent); border-radius: var(--r); padding: 14px; margin: 4px 0 4px; }
  .hero small { opacity: .85; font-size: 12px; font-weight: 650; }
  .hero b { display: block; font-size: 16px; margin: 3px 0 2px; }
  .hero .cnt { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .ev { background: var(--card); border-radius: var(--r); padding: 12px; }
  .ev.past { opacity: .55; }
  .ev .top { display: flex; gap: 8px; align-items: flex-start; }
  .ev .top b { flex: 1; font-size: 14.5px; font-weight: 680; line-height: 1.3; }
  .st { font-size: 11.5px; font-weight: 750; padding: 3px 8px; border-radius: 7px; white-space: nowrap; }
  .st.now { background: rgba(34,197,94,.14); color: var(--ok); } .st.soon { background: rgba(58,160,255,.13); color: var(--info); } .st.past { background: var(--chip); color: var(--hint); }
  .ev .dates { font-size: 12.5px; color: var(--hint); margin-top: 5px; }
  .ev .iz { font-size: 12.5px; margin-top: 6px; }
  .ev .bar { height: 5px; margin-top: 8px; } .ev .bar i { background: var(--ok); }

  .cmpbar { position: fixed; left: 14px; right: 14px; bottom: calc(70px + var(--safe-b)); z-index: 25; }
  .toast { position: fixed; left: 50%; bottom: calc(86px + var(--safe-b)); transform: translateX(-50%) translateY(20px); opacity: 0;
    background: rgba(20,20,20,.88); color: #fff; padding: 9px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; transition: .2s; z-index: 60; pointer-events: none; max-width: 86vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  h4.grp { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--hint); margin: 14px 2px 6px; font-weight: 700; }
</style>
</head>
<body>
  <header class="appbar">
    <div class="logo">🎓</div>
    <div class="ttl"><h1>Career Map <small style="font-size:11px;color:var(--hint);font-weight:600">v2.0</small></h1><p id="subtitle"></p></div>
    <button class="icon-btn" data-act="refresh" aria-label="refresh">🔄</button>
    <button class="icon-btn" data-act="lang" id="lang_btn">RU</button>
  </header>

  <!-- ===== Katalog ===== -->
  <section id="v-catalog" class="view">
    <div class="sticky">
      <div class="search">
        <span class="ico">🔍</span>
        <input id="q" type="search" autocomplete="off" enterkeyhint="search">
        <button class="clr hidden" data-act="clear-q" aria-label="clear">✕</button>
      </div>
      <div class="chips" id="kinds"></div>
    </div>
    <div class="wrap">
      <div id="kind_note"></div>
      <div class="chips" id="subs" style="padding-top:0;margin-bottom:2px"></div>
      <div class="filters">
        <select id="region"></select>
        <select id="sort"></select>
      </div>
      <div class="scorebox hidden" id="scorebox">
        <div class="row1">
          <label for="score_n" id="score_lbl"></label>
          <input id="score_n" type="number" inputmode="decimal" min="0" max="189" step="0.1" placeholder="—">
        </div>
        <input id="score_r" type="range" min="0" max="189" step="0.5" value="0">
        <div class="row2">
          <button class="switch" data-act="reach" id="reach_sw"><i></i><span id="reach_lbl"></span></button>
          <button class="link-btn" data-view="calc" id="to_calc"></button>
        </div>
      </div>
      <div class="stats"><span id="found"></span><span id="sync"></span></div>
      <div class="list" id="list"></div>
      <div class="more" id="sentinel"></div>
    </div>
  </section>

  <!-- ===== Kalkulyator ===== -->
  <section id="v-calc" class="view hidden"><div class="wrap" id="calc"></div></section>

  <!-- ===== Saqlanganlar ===== -->
  <section id="v-fav" class="view hidden"><div class="wrap" id="favs"></div></section>

  <!-- ===== Muddatlar ===== -->
  <section id="v-dates" class="view hidden"><div class="wrap" id="dates"></div></section>

  <div class="cmpbar hidden" id="cmpbar"><button class="btn block" data-act="cmp-run" id="cmp_run"></button></div>

  <nav class="tabbar" id="tabbar"></nav>

  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="bd" data-act="close"></div>
    <div class="panel" id="panel"></div>
  </div>
  <div class="toast" id="toast"></div>

<script>
  // Xato bo'lsa ekranda ko'rsatamiz (eski Telegram/WebView'da nima buzilganini bilish uchun)
  window.addEventListener("error", function (e) {
    var d = document.getElementById("fatal");
    if (!d) { d = document.createElement("div"); d.id = "fatal";
      d.style.cssText = "position:fixed;left:10px;right:10px;top:10px;z-index:99;background:#b91c1c;color:#fff;padding:10px 12px;border-radius:10px;font:12px/1.4 monospace;white-space:pre-wrap";
      document.body.appendChild(d); }
    d.textContent = "Career Map v2.0 xato:\n" + (e.message || e) + (e.lineno ? " (qator " + e.lineno + ")" : "") + "\n" + navigator.userAgent;
  });
</script>
<script>
"use strict";
/* =====================================================================
   SOZLAMALAR
   ===================================================================== */
const CONFIG = {
  // BotFather → /newapp orqali olingan havola, masalan: "https://t.me/CareerMapBot/app".
  // To'ldirilsa, "Ulashish" tugmasi to'g'ridan-to'g'ri shu kartani ochadigan havola beradi.
  BOT_APP_LINK: "",
};
// Google Sheets: Fayl → Ulashish → Internetda chop etish → varaq → CSV.

// SHA-1 (botdagi item_hash bilan bir xil identifikator olish uchun)
function sha1(str) {
  const b = new TextEncoder().encode(str), l = b.length, nb = (((l + 8) >> 6) + 1) * 16, w = new Uint32Array(nb);
  for (let i = 0; i < l; i++) w[i >> 2] |= b[i] << (24 - (i % 4) * 8);
  w[l >> 2] |= 0x80 << (24 - (l % 4) * 8); w[nb - 1] = l * 8;
  const rol = (x, n) => ((x << n) | (x >>> (32 - n))) >>> 0, W = new Uint32Array(80);
  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
  for (let i = 0; i < nb; i += 16) {
    for (let j = 0; j < 16; j++) W[j] = w[i + j];
    for (let j = 16; j < 80; j++) W[j] = rol(W[j - 3] ^ W[j - 8] ^ W[j - 14] ^ W[j - 16], 1);
    let a = h0, bb = h1, c = h2, d = h3, e = h4;
    for (let j = 0; j < 80; j++) {
      let f, k;
      if (j < 20) { f = (bb & c) | (~bb & d); k = 0x5A827999; }
      else if (j < 40) { f = bb ^ c ^ d; k = 0x6ED9EBA1; }
      else if (j < 60) { f = (bb & c) | (bb & d) | (c & d); k = 0x8F1BBCDC; }
      else { f = bb ^ c ^ d; k = 0xCA62C1D6; }
      const tmp = (rol(a, 5) + (f >>> 0) + e + k + W[j]) >>> 0;
      e = d; d = c; c = rol(bb, 30); bb = a; a = tmp;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + bb) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
  }
  return [h0, h1, h2, h3, h4].map(h => h.toString(16).padStart(8, "0")).join("");
}

// RFC 4180 CSV
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += ch; }
    else if (ch === '"') inQ = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const header = (rows.shift() || []).map(h => h.trim());
  return rows.filter(r => r.some(v => v.trim())).map(r => {
    const o = {}; header.forEach((h, i) => { if (h && !(h in o)) o[h] = (r[i] || "").trim(); }); return o;
  });
}

function setRows(k, txt, status) { RAW[k] = txt; DB[k] = prep(k, parseCSV(txt)); STATUS[k] = status; }

async function fetchText(k) {
  const src = SHEETS[k];
  const ok = txt => { const head = txt.replace(/^﻿/, "").split(/\r?\n/, 1)[0] || ""; return !/^\s*</.test(txt) && head.split(",").map(s => s.trim().replace(/"/g, "")).includes(src.need); };
  if (src.url) {
    try {
      const res = await fetch(src.url + (src.url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
      if (res.ok) { const txt = await res.text(); if (ok(txt)) return { txt, status: "live" }; }
    } catch (e) {}
  }
  for (const f of src.local) {
    try { const res = await fetch(f, { cache: "no-cache" }); if (res.ok) { const txt = await res.text(); if (ok(txt)) return { txt, status: "local" }; } } catch (e) {}
  }
  throw new Error("load failed");
}

function loadKind(k, force = false) {
  if (LOAD[k] && !force) return LOAD[k];
  LOAD[k] = new Promise(resolve => {
    let done = false; const finish = () => { if (!done) { done = true; resolve(); } };
    if (!DB[k]) { const c = lsGet("cm_d_" + k); if (c && c.txt) { try { setRows(k, c.txt, "cache"); finish(); } catch (e) {} } }
    fetchText(k).then(({ txt, status }) => {
      const changed = txt !== RAW[k];
      if (changed) { setRows(k, txt, status); lsSet("cm_d_" + k, { t: Date.now(), txt }); }
      else STATUS[k] = status;
      if (done && changed) onDataUpdate(k, force);
      else if (force) toast(t("t_updated"));
      finish(); renderSync();
    }).catch(() => { if (!DB[k]) { DB[k] = []; STATUS[k] = "offline"; } finish(); renderSync(); });
  });
  return LOAD[k];
}
function onDataUpdate(k, manual) {

function chance(r, s) {
  if (!s) return null;
  const g = r._g, k = r._kb ?? r._ot;
  if (g === null && k === null) return null;
  if (g !== null && s >= g) return { c: "ok", lbl: t("ch_grant"), d: s - g };
  if (k !== null && s >= k) return { c: "mid", lbl: t("ch_kont"), d: g !== null ? g - s : 0 };
  const need = (k ?? g) - s;
  return { c: "no", lbl: t("ch_need", { d: fmt(need) }), d: need };
}

function filtered() {
  const rows = DB[S.kind] || [];
  const toks = norm(query).split(" ").filter(Boolean);
  const reachOnly = scoreOn() && S.reach;
  const list = rows.filter(r => {
    if (S.kind === "otm" && S.sub !== "ALL" && r.soha !== S.sub) return false;
    if (S.kind === "litsey" && S.sub !== "ALL" && r._grp !== S.sub) return false;
    if (S.kind === "texnikum" && S.base !== "all") {
      if (r._all) { if (S.base === "otm2") return false; }
      else if (S.base === "9" ? !r._n9 : S.base === "11" ? !(r._g11 + r._k11) : !r.otm_2kurs) return false;
    }
    if (S.region && !r._all && r.viloyat !== S.region) return false;
    if (toks.length && !toks.every(x => r._hay.includes(x))) return false;
    if (reachOnly) { const c = chance(r, S.score); if (!c || c.c === "no") return false; }
    return true;
  });
  const byName = (a, b) => String(a._name).localeCompare(String(b._name));
  const g = r => r._g ?? r._kb ?? r._ot;
  switch (S.sort) {
    case "grant_desc": list.sort((a, b) => (g(b) ?? -1) - (g(a) ?? -1)); break;
    case "grant_asc": list.sort((a, b) => (g(a) ?? 999) - (g(b) ?? 999)); break;
    case "price": list.sort((a, b) => (a._price ?? 1e9) - (b._price ?? 1e9)); break;
    case "kvota": list.sort((a, b) => (b._kv ?? -1) - (a._kv ?? -1)); break;
    case "name": list.sort(byName); break;
    case "chance": {
      const rank = r => { const c = chance(r, S.score); return !c ? 3 : c.c === "ok" ? 0 : c.c === "mid" ? 1 : 2; };
      list.sort((a, b) => { const ra = rank(a), rb = rank(b); if (ra !== rb) return ra - rb;
        if (ra === 2) return chance(a, S.score).d - chance(b, S.score).d; return (g(b) ?? 0) - (g(a) ?? 0); });
    }
  }
  // Umumiy (butun respublika) qatorlar standart tartibda oxirida
  if (S.sort === "default") list.sort((a, b) => (a._all ? 1 : 0) - (b._all ? 1 : 0));
  return list;
}

const pd = s => { const m = String(s || "").match(/(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const fdate = d => `${d.getDate()}-${t("months")[d.getMonth()]} ${d.getFullYear()}`;
async function renderDates() {
  const box = $("dates");
  if (!DB.muddat) box.innerHTML = '<div class="skel" style="margin-top:8px"></div>'.repeat(4);
  await loadKind("muddat");
  if (S.view !== "dates") return;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const DAY = 864e5;
  const evs = (DB.muddat || []).map(r => {
    const a = pd(r.boshlanish), b = pd(r.tugash) || a; if (!a) return null;
    const st = today < a ? "soon" : today > b ? "past" : "now";
    return { r, a, b, st, toStart: Math.round((a - today) / DAY), toEnd: Math.round((b - today) / DAY), prog: Math.min(1, Math.max(0, (today - a) / Math.max(DAY, b - a))) };
  }).filter(Boolean);
  const order = { now: 0, soon: 1, past: 2 };
  evs.sort((x, y) => order[x.st] - order[y.st] || (x.st === "past" ? y.b - x.b : x.a - y.a));
  const turs = ["all", ...["otm", "litsey", "texnikum", "harbiy"].filter(tu => evs.some(e => e.r.tur === tu))];
  if (!turs.includes(S.dTur)) S.dTur = "all";
  const list = evs.filter(e => S.dTur === "all" || e.r.tur === S.dTur);
  let h = "";
  const nxt = list.find(e => e.st !== "past");
  if (nxt) {
    const cnt = nxt.st === "now" ? (nxt.toEnd === 0 ? t("d_today") : t("d_ends", { d: nxt.toEnd })) : (nxt.toStart === 0 ? t("d_today") : nxt.toStart);
    h += `<div class="hero"><small>${nxt.st === "now" ? "🟢 " + t("d_now") : "⏳ " + t("d_next")}</small><b>${esc(tr(nxt.r, "nomi"))}</b>

      <small>${fdate(nxt.a)} — ${fdate(nxt.b)}</small></div>`;

  h += `<div class="list">` + list.map(e => {
    const lbl = e.st === "now" ? (e.toEnd === 0 ? t("d_today") : t("d_ends", { d: e.toEnd })) : e.st === "soon" ? (e.toStart === 0 ? t("d_today") : t("d_left", { d: e.toStart })) : t("d_past");
    const approx = ["1", "ha", "true"].includes(String(e.r.taxminiy).trim()) ? ` · <i>${t("d_approx")}</i>` : "";
    return `<div class="ev ${e.st === "past" ? "past" : ""}"><div class="top"><b>${esc(tr(e.r, "nomi"))}</b><span class="st ${e.st}">${esc(lbl)}</span></div>
      <div class="dates">📅 ${fdate(e.a)} — ${fdate(e.b)}${approx}</div>
      ${e.st === "now" ? `<div class="bar"><i style="width:${e.prog * 100}%"></i></div>` : ""}
      ${tr(e.r, "izoh") ? `<div class="iz">${esc(tr(e.r, "izoh"))}</div>` : ""}
      ${e.r.havola ? `<div style="margin-top:8px"><button class="chip sm" data-act="link" data-url="${esc(href(e.r.havola))}">${t("d_open")} · ${esc(e.r.havola)}</button></div>` : ""}</div>`;
  }).join("") + `</div>`;
  h += `<div class="note" style="margin-top:12px">${esc(t("d_remind"))}</div>`;

document.addEventListener("click", e => {

  setTimeout(() => KINDS.concat("muddat").forEach(k => loadKind(k)), 1200);
})();
</script>
